name: .NET Desktop Build and Release - RimSharp

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Permissão necessária para o gh-release publicar

jobs:
  # ==========================================
  # JOB 1: BUILD WINDOWS
  # ==========================================
  build-windows:
    runs-on: windows-latest
    env:
      Solution_Path: RimSharp.sln
      Project_Path: RimSharp.csproj

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore $env:Solution_Path

    - name: Build solution
      run: dotnet build $env:Solution_Path --configuration Release --no-restore

    - name: Execute unit tests
      run: dotnet test RimSharp.Tests/RimSharp.Tests.csproj --configuration Release --no-build

    - name: Publish and Package
      shell: pwsh
      run: |
        dotnet publish $env:Project_Path `
          -f net10.0-windows `
          -r win-x64 `
          -c Release `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishReadyToRun=true `
          -p:EnableCompressionInSingleFile=true `
          --output ./publish `
          -p:Version="$($env:GITHUB_REF_NAME.TrimStart('v'))"

        $folderName = "RimSharp_Win"
        $zipName = "RimSharp_${env:GITHUB_REF_NAME}.zip"

        New-Item -ItemType Directory -Path $folderName -Force
        Copy-Item -Path ./publish/* -Destination $folderName -Recurse -Force
        Compress-Archive -Path $folderName -DestinationPath $zipName -Force

        # Cria uma pasta para centralizar o artefato gerado
        New-Item -ItemType Directory -Path ./win-artifacts -Force
        Move-Item -Path $zipName -Destination ./win-artifacts/

    # Salva o arquivo temporariamente no GitHub Actions
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v5
      with:
        name: windows-artifacts
        path: ./win-artifacts/*
        retention-days: 1

  # ==========================================
  # JOB 2: BUILD LINUX
  # ==========================================
  build-linux:
    runs-on: ubuntu-24.04
    env:
      Project_Path: RimSharp.csproj

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      shell: bash
      run: dotnet restore RimSharp.sln

    - name: Run unit tests (Linux)
      shell: bash
      run: dotnet test RimSharp.Tests/RimSharp.Tests.csproj --framework net10.0 --configuration Release --no-restore

    - name: Install packaging tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes imagemagick rpm

    - name: Publish and Package
      shell: bash
      run: |
        set -euo pipefail

        version="${GITHUB_REF_NAME#v}"
        package_version="${version//-/.}"

        dotnet publish "$Project_Path" \
          -f net10.0 \
          -r linux-x64 \
          -c Release \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishReadyToRun=true \
          -p:EnableCompressionInSingleFile=true \
          -p:Version="${GITHUB_REF_NAME#v}" \
          --output ./publish-linux

        mkdir -p package-root/opt/rimsharp package-root/usr/bin
        cp -a ./publish-linux/. package-root/opt/rimsharp/
        ln -s /opt/rimsharp/RimSharp package-root/usr/bin/rimsharp

        mkdir -p package-root/usr/share/applications package-root/usr/share/icons/hicolor/256x256/apps
        convert -background none "icon.ico[0]" -resize 256x256 package-root/usr/share/icons/hicolor/256x256/apps/rimsharp.png
        cat > package-root/usr/share/applications/rimsharp.desktop <<'EOF'
        [Desktop Entry]
        Name=RimSharp
        Comment=RimWorld mod manager
        Exec=rimsharp
        Icon=rimsharp
        Terminal=false
        Type=Application
        Categories=Game;Utility;
        EOF

        # Cria pasta de saída para os pacotes do Linux
        mkdir -p ./linux-artifacts

        # 1. Tarball
        mkdir -p tar-root/RimSharp
        cp -a ./publish-linux/. tar-root/RimSharp/
        tar -czf "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.tar.gz" -C tar-root RimSharp

        # 2. Deb
        mkdir -p deb-root/DEBIAN
        cp -a package-root/. deb-root/
        cat > deb-root/DEBIAN/control <<EOF
        Package: rimsharp
        Version: ${package_version}
        Section: games
        Priority: optional
        Architecture: amd64
        Depends: libwebkit2gtk-4.1-0, lib32gcc-s1, libstdc++6, libicu70 | libicu72 | libicu74
        Maintainer: RimSharp contributors
        Description: RimWorld mod manager
         A desktop mod manager for RimWorld.
        EOF
        dpkg-deb --build --root-owner-group deb-root "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_amd64.deb"

        # 3. RPM
        mkdir -p rpm-root/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        tar -czf rpm-root/SOURCES/rimsharp.tar.gz -C package-root .
        cat > rpm-root/SPECS/rimsharp.spec <<EOF
        Name: rimsharp
        Version: ${package_version}
        Release: 1
        Summary: RimWorld mod manager
        License: AGPL-3.0
        BuildArch: x86_64
        Source0: rimsharp.tar.gz
        Requires: webkit2gtk4.1
        Requires: glibc.i686
        Requires: libstdc++.i686
        Requires: libicu

        %description
        A desktop mod manager for RimWorld.

        %prep
        mkdir source
        tar -xzf %{SOURCE0} -C source

        %install
        mkdir -p %{buildroot}
        cp -a source/. %{buildroot}/

        %files
        /opt/rimsharp
        /usr/bin/rimsharp
        /usr/share/applications/rimsharp.desktop
        /usr/share/icons/hicolor/256x256/apps/rimsharp.png
        EOF
        rpmbuild --define "_topdir $(pwd)/rpm-root" -bb rpm-root/SPECS/rimsharp.spec
        cp rpm-root/RPMS/x86_64/*.rpm "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_x86_64.rpm"

        # 4. AppImage
        mkdir -p appimage-root/usr/bin appimage-root/usr/share/applications appimage-root/usr/share/icons/hicolor/256x256/apps
        cp -a ./publish-linux/. appimage-root/usr/bin/
        cp package-root/usr/share/applications/rimsharp.desktop appimage-root/usr/share/applications/
        cp package-root/usr/share/applications/rimsharp.desktop appimage-root/rimsharp.desktop
        cp package-root/usr/share/icons/hicolor/256x256/apps/rimsharp.png appimage-root/usr/share/icons/hicolor/256x256/apps/
        cp package-root/usr/share/icons/hicolor/256x256/apps/rimsharp.png appimage-root/rimsharp.png
        cat > appimage-root/AppRun <<'EOF'
        #!/usr/bin/env bash
        exec "$(dirname "$(readlink -f "$0")")/usr/bin/RimSharp" "$@"
        EOF
        chmod +x appimage-root/AppRun
        curl --fail --location --retry 3 \
          --output appimagetool.AppImage \
          https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool.AppImage
        ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run appimage-root \
          "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.AppImage"

    - name: Validate Linux packages
      shell: bash
      run: |
        set -euo pipefail
        for artifact in \
          "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.tar.gz" \
          "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_amd64.deb" \
          "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_x86_64.rpm" \
          "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.AppImage"; do
          test -s "$artifact"
        done

        tar -tzf "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.tar.gz" > tar-contents.txt
        grep -q '^RimSharp/RimSharp$' tar-contents.txt
        dpkg-deb --info "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_amd64.deb" >/dev/null
        rpm -qip "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_x86_64.rpm" >/dev/null
        file "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.AppImage" | grep -qi 'appimage\|executable'

    # Salva os arquivos temporariamente no GitHub Actions
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v5
      with:
        name: linux-artifacts
        path: ./linux-artifacts/*
        retention-days: 1

  # ==========================================
  # JOB 3: BUILD MACOS
  # ==========================================
  build-macos:
    runs-on: macos-latest
    env:
      Project_Path: RimSharp.csproj

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      shell: bash
      run: dotnet restore RimSharp.sln

    - name: Run unit tests (macOS)
      shell: bash
      run: dotnet test RimSharp.Tests/RimSharp.Tests.csproj --framework net10.0 --configuration Release --no-restore

    - name: Install packaging tools (macOS)
      shell: bash
      run: |
        set -euo pipefail
        brew install imagemagick

    - name: Prepare macOS icon (icns)
      shell: bash
      run: |
        set -euo pipefail

        # Log what is inside the .ico (frame sizes) to make failures debuggable
        magick identify icon.ico

        # Use the largest frame in the .ico instead of blindly taking frame 0
        idx=$(magick identify -format "%w %s\n" icon.ico | sort -k1,1nr | head -1 | awk '{print $2}')

        # Square 1024x1024 master: transparent padding, 8-bit RGBA, sRGB, 72 DPI
        magick "icon.ico[$idx]" -background none -resize 1024x1024 \
          -gravity center -extent 1024x1024 \
          -colorspace sRGB -units PixelsPerInch -density 72 \
          PNG32:icon_1024.png

        build_with_magick() {
          rm -rf appicon.iconset && mkdir appicon.iconset
          mk() { # mk <pixels> <filename>
            magick icon_1024.png -resize "${1}x${1}" -background none \
              -gravity center -extent "${1}x${1}" \
              -colorspace sRGB -units PixelsPerInch -density 72 \
              "PNG32:appicon.iconset/$2"
          }
          mk 16   icon_16x16.png
          mk 32   icon_16x16@2x.png
          mk 32   icon_32x32.png
          mk 64   icon_32x32@2x.png
          mk 128  icon_128x128.png
          mk 256  icon_128x128@2x.png
          mk 256  icon_256x256.png
          mk 512  icon_256x256@2x.png
          mk 512  icon_512x512.png
          mk 1024 icon_512x512@2x.png
        }

        build_with_sips() {
          rm -rf appicon.iconset && mkdir appicon.iconset
          for spec in \
            16:icon_16x16.png      32:icon_16x16@2x.png \
            32:icon_32x32.png      64:icon_32x32@2x.png \
            128:icon_128x128.png   256:icon_128x128@2x.png \
            256:icon_256x256.png   512:icon_256x256@2x.png \
            512:icon_512x512.png   1024:icon_512x512@2x.png; do
            sips -z "${spec%%:*}" "${spec%%:*}" icon_1024.png \
              --out "appicon.iconset/${spec#*:}" >/dev/null
          done
        }

        build_with_magick

        # Diagnostics: exact dimensions, bit depth and color type of every file
        file appicon.iconset/*.png
        sips -g pixelWidth -g pixelHeight appicon.iconset/*.png

        if ! iconutil -c icns appicon.iconset -o RimSharp.icns; then
          echo "::warning::iconutil rejected the ImageMagick PNGs, retrying with sips"
          build_with_sips
          file appicon.iconset/*.png
          iconutil -c icns appicon.iconset -o RimSharp.icns
        fi

        ls -l RimSharp.icns

    - name: Publish and Package
      shell: bash
      run: |
        set -euo pipefail

        version="${GITHUB_REF_NAME#v}"

        mkdir -p ./macos-artifacts

        for rid in osx-arm64 osx-x64; do
          dotnet publish "$Project_Path" \
            -f net10.0 \
            -r "$rid" \
            -c Release \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version="${GITHUB_REF_NAME#v}" \
            --output "./publish-$rid"

          # --- .app bundle ---
          mkdir -p "./bundle-$rid/RimSharp.app/Contents/MacOS"
          mkdir -p "./bundle-$rid/RimSharp.app/Contents/Resources"

          # Single-file publish output binary name matches AssemblyName (RimSharp)
          PUBLISHED_BINARY="./publish-$rid/RimSharp"
          if [ ! -f "$PUBLISHED_BINARY" ]; then
            # Fallback: find the single executable in publish output
            PUBLISHED_BINARY=$(find "./publish-$rid" -maxdepth 1 -type f -perm -u=x | head -n1)
          fi
          cp "$PUBLISHED_BINARY" "./bundle-$rid/RimSharp.app/Contents/MacOS/RimSharp"
          chmod +x "./bundle-$rid/RimSharp.app/Contents/MacOS/RimSharp"

          # Icon
          cp RimSharp.icns "./bundle-$rid/RimSharp.app/Contents/Resources/RimSharp.icns"

          # Info.plist (unquoted heredoc so $version expands).
          # NOTE: heredoc body and EOF must sit at the run block's base indent (8 spaces),
          # so that after YAML strips it they start at column 0 for bash.
          cat > "./bundle-$rid/RimSharp.app/Contents/Info.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleName</key>
            <string>RimSharp</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>RimSharp</string>
            <key>CFBundleIdentifier</key>
            <string>io.github.robsonswe.RimSharp</string>
            <key>CFBundleShortVersionString</key>
            <string>$version</string>
            <key>CFBundleVersion</key>
            <string>$version</string>
            <key>CFBundleIconFile</key>
            <string>RimSharp.icns</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOF

          # Ad-hoc sign (keeps quarantine-time "damaged" reports away)
          codesign --force --deep -s - "./bundle-$rid/RimSharp.app"

          # Verify shape
          test -x "./bundle-$rid/RimSharp.app/Contents/MacOS/RimSharp"
          plutil -lint "./bundle-$rid/RimSharp.app/Contents/Info.plist"

          # --- Tarball (existing) ---
          mkdir -p tar-root/RimSharp
          cp -a "./publish-$rid/." tar-root/RimSharp/
          tar -czf "./macos-artifacts/RimSharp_${rid}_${GITHUB_REF_NAME}.tar.gz" -C tar-root RimSharp

          # --- DMG ---
          mkdir -p "./dmg-dir-$rid"
          cp -a "./bundle-$rid/RimSharp.app" "./dmg-dir-$rid/"
          hdiutil create -volname RimSharp -srcfolder "./dmg-dir-$rid" -ov -format UDZO "./macos-artifacts/RimSharp_${rid}_${GITHUB_REF_NAME}.dmg"
        done

    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v5
      with:
        name: macos-artifacts
        path: ./macos-artifacts/*
        retention-days: 1

  # ==========================================
  # JOB 4: RELEASE
  # ==========================================
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
    # 1. Faz o checkout do repositório para ter acesso ao RELEASE_NOTES.md
    - name: Checkout repository
      uses: actions/checkout@v5

    # 2. Baixa todos os binários gerados pelos jobs anteriores
    - name: Download all artifacts
      uses: actions/download-artifact@v6
      with:
        path: ./release-assets
        merge-multiple: true

    # 3. Constrói o corpo do release com o cabeçalho e o conteúdo do RELEASE_NOTES.md
    - name: Prepare Release Notes Body
      shell: bash
      run: |
        {
          echo "RimSharp - RimWorld Mod Manager"
          echo "Version: ${{ github.ref_name }}"
          echo ""
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md
          elif [ -f release_notes.md ]; then
            cat release_notes.md
          else
            echo "Release ${{ github.ref_name }}"
          fi
        } > release_body.md

    # 4. Publica o release consolidado
    - name: Create Consolidated GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: RimSharp Release ${{ github.ref_name }}
        body_path: release_body.md
        prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        files: ./release-assets/*