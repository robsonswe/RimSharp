name: .NET Desktop Build and Release - RimSharp

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Permissão necessária para o gh-release publicar

jobs:
  # ==========================================
  # JOB 1: BUILD WINDOWS
  # ==========================================
  build-windows:
    runs-on: windows-latest
    env:
      Solution_Path: RimSharp.sln
      Project_Path: RimSharp.csproj

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore $env:Solution_Path

    - name: Build solution
      run: dotnet build $env:Solution_Path --configuration Release --no-restore

    - name: Execute unit tests
      run: dotnet test RimSharp.Tests/RimSharp.Tests.csproj --configuration Release --no-build

    - name: Publish and Package
      shell: pwsh
      run: |
        dotnet publish $env:Project_Path `
          -f net8.0-windows `
          -r win-x64 `
          -c Release `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishReadyToRun=true `
          -p:EnableCompressionInSingleFile=true `
          --output ./publish `
          -p:Version="$($env:GITHUB_REF_NAME.TrimStart('v'))"

        $folderName = "RimSharp_Win"
        $zipName = "RimSharp_${env:GITHUB_REF_NAME}.zip"

        New-Item -ItemType Directory -Path $folderName -Force
        Copy-Item -Path ./publish/* -Destination $folderName -Recurse -Force
        Compress-Archive -Path $folderName -DestinationPath $zipName -Force

        # Cria uma pasta para centralizar o artefato gerado
        New-Item -ItemType Directory -Path ./win-artifacts -Force
        Move-Item -Path $zipName -Destination ./win-artifacts/

    # Salva o arquivo temporariamente no GitHub Actions
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-artifacts
        path: ./win-artifacts/*
        retention-days: 1

  # ==========================================
  # JOB 2: BUILD LINUX
  # ==========================================
  build-linux:
    runs-on: ubuntu-24.04
    env:
      Project_Path: RimSharp.csproj

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      shell: bash
      run: dotnet restore RimSharp.sln

    - name: Run unit tests (Linux)
      shell: bash
      run: dotnet test RimSharp.Tests/RimSharp.Tests.csproj --framework net8.0 --configuration Release --no-restore

    - name: Install packaging tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes imagemagick rpm

    - name: Publish and Package
      shell: bash
      run: |
        set -euo pipefail

        version="${GITHUB_REF_NAME#v}"
        package_version="${version//-/.}"

        dotnet publish "$Project_Path" \
          -f net8.0 \
          -r linux-x64 \
          -c Release \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishReadyToRun=true \
          -p:EnableCompressionInSingleFile=true \
          -p:Version="${GITHUB_REF_NAME#v}" \
          --output ./publish-linux

        mkdir -p package-root/opt/rimsharp package-root/usr/bin
        cp -a ./publish-linux/. package-root/opt/rimsharp/
        ln -s /opt/rimsharp/RimSharp package-root/usr/bin/rimsharp

        mkdir -p package-root/usr/share/applications package-root/usr/share/icons/hicolor/256x256/apps
        convert -background none "icon.ico[0]" -resize 256x256 package-root/usr/share/icons/hicolor/256x256/apps/rimsharp.png
        cat > package-root/usr/share/applications/rimsharp.desktop <<'EOF'
        [Desktop Entry]
        Name=RimSharp
        Comment=RimWorld mod manager
        Exec=rimsharp
        Icon=rimsharp
        Terminal=false
        Type=Application
        Categories=Game;Utility;
        EOF

        # Cria pasta de saída para os pacotes do Linux
        mkdir -p ./linux-artifacts

        # 1. Tarball
        mkdir -p tar-root/RimSharp
        cp -a ./publish-linux/. tar-root/RimSharp/
        tar -czf "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.tar.gz" -C tar-root RimSharp

        # 2. Deb
        mkdir -p deb-root/DEBIAN
        cp -a package-root/. deb-root/
        cat > deb-root/DEBIAN/control <<EOF
        Package: rimsharp
        Version: ${package_version}
        Section: games
        Priority: optional
        Architecture: amd64
        Depends: libwebkit2gtk-4.1-0, lib32gcc-s1, libstdc++6, libicu70 | libicu72 | libicu74
        Maintainer: RimSharp contributors
        Description: RimWorld mod manager
         A desktop mod manager for RimWorld.
        EOF
        dpkg-deb --build --root-owner-group deb-root "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_amd64.deb"

        # 3. RPM
        mkdir -p rpm-root/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        tar -czf rpm-root/SOURCES/rimsharp.tar.gz -C package-root .
        cat > rpm-root/SPECS/rimsharp.spec <<EOF
        Name: rimsharp
        Version: ${package_version}
        Release: 1
        Summary: RimWorld mod manager
        License: AGPL-3.0
        BuildArch: x86_64
        Source0: rimsharp.tar.gz
        Requires: webkit2gtk4.1
        Requires: glibc.i686
        Requires: libstdc++.i686
        Requires: libicu

        %description
        A desktop mod manager for RimWorld.

        %prep
        mkdir source
        tar -xzf %{SOURCE0} -C source

        %install
        mkdir -p %{buildroot}
        cp -a source/. %{buildroot}/

        %files
        /opt/rimsharp
        /usr/bin/rimsharp
        /usr/share/applications/rimsharp.desktop
        /usr/share/icons/hicolor/256x256/apps/rimsharp.png
        EOF
        rpmbuild --define "_topdir $(pwd)/rpm-root" -bb rpm-root/SPECS/rimsharp.spec
        cp rpm-root/RPMS/x86_64/*.rpm "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_x86_64.rpm"

        # 4. AppImage
        mkdir -p appimage-root/usr/bin appimage-root/usr/share/applications appimage-root/usr/share/icons/hicolor/256x256/apps
        cp -a ./publish-linux/. appimage-root/usr/bin/
        cp package-root/usr/share/applications/rimsharp.desktop appimage-root/usr/share/applications/
        cp package-root/usr/share/applications/rimsharp.desktop appimage-root/rimsharp.desktop
        cp package-root/usr/share/icons/hicolor/256x256/apps/rimsharp.png appimage-root/usr/share/icons/hicolor/256x256/apps/
        cp package-root/usr/share/icons/hicolor/256x256/apps/rimsharp.png appimage-root/rimsharp.png
        cat > appimage-root/AppRun <<'EOF'
        #!/usr/bin/env bash
        exec "$(dirname "$(readlink -f "$0")")/usr/bin/RimSharp" "$@"
        EOF
        chmod +x appimage-root/AppRun
        curl --fail --location --retry 3 \
          --output appimagetool.AppImage \
          https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool.AppImage
        ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run appimage-root \
          "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.AppImage"

    - name: Validate Linux packages
      shell: bash
      run: |
        set -euo pipefail
        for artifact in \
          "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.tar.gz" \
          "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_amd64.deb" \
          "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_x86_64.rpm" \
          "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.AppImage"; do
          test -s "$artifact"
        done

        tar -tzf "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.tar.gz" > tar-contents.txt
        grep -q '^RimSharp/RimSharp$' tar-contents.txt
        dpkg-deb --info "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_amd64.deb" >/dev/null
        rpm -qip "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}_x86_64.rpm" >/dev/null
        file "./linux-artifacts/RimSharp_linux-x64_${GITHUB_REF_NAME}.AppImage" | grep -qi 'appimage\|executable'

    # Salva os arquivos temporariamente no GitHub Actions
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-artifacts
        path: ./linux-artifacts/*
        retention-days: 1

  # ==========================================
  # JOB 3: RELEASE
  # ==========================================
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
    # 1. Faz o checkout do repositório para ter acesso ao RELEASE_NOTES.md
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Baixa todos os binários gerados pelos jobs anteriores
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release-assets
        merge-multiple: true

    # 3. Constrói o corpo do release com o cabeçalho e o conteúdo do RELEASE_NOTES.md
    - name: Prepare Release Notes Body
      shell: bash
      run: |
        {
          echo "RimSharp - RimWorld Mod Manager"
          echo "Version: ${{ github.ref_name }}"
          echo ""
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md
          elif [ -f release_notes.md ]; then
            cat release_notes.md
          else
            echo "Release ${{ github.ref_name }}"
          fi
        } > release_body.md

    # 4. Publica o release consolidado
    - name: Create Consolidated GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: RimSharp Release ${{ github.ref_name }}
        body_path: release_body.md
        prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        files: ./release-assets/*